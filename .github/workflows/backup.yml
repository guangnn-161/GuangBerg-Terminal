name: Automated Database Backup

on:
  schedule:
    - cron: "0 2 * * 0"  # Chạy tự động vào lúc 2h sáng Chủ Nhật hàng tuần
  workflow_dispatch:     # Cho phép bấm nút chạy thủ công trên GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export Supabase Tables ra JSON
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # Khóa bảo mật lưu trong GitHub Secrets
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Secrets SUPABASE_URL hoặc SUPABASE_SERVICE_KEY chưa được cấu hình. Bỏ qua backup."
            exit 0
          fi

          mkdir -p backup
          for t in profile projects timeline skills notes vault_files; do
            echo "Backing up table: $t"
            curl -s "$URL/rest/v1/$t?select=*" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" > backup/$t.json
          done

      - name: Commit & Push bản sao lưu vào Repo
        run: |
          git config user.name "backup-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || (git commit -m "chore: weekly automated database backup" && git push)
